syntax = "proto3";

package user.v1;

option go_package = "github.com/go-kratos/kratos-layout/api/user/v1;v1";

import "google/api/annotations.proto";

service UserService {
  rpc Register (RegisterRequest) returns (AuthReply) {
    option (google.api.http) = {
      post: "/v1/user/register"
      body: "*"
    };
  }

  rpc Login (LoginRequest) returns (AuthReply) {
    option (google.api.http) = {
      post: "/v1/user/login"
      body: "*"
    };
  }

  rpc MockLogin (MockLoginRequest) returns (AuthReply) {
    option (google.api.http) = {
      post: "/v1/user/mock_login"
      body: "*"
    };
  }

  rpc GetProfile (GetProfileRequest) returns (GetProfileReply) {
    option (google.api.http) = {
      get: "/v1/user/profile"
    };
  }

  rpc UpdateProfile (UpdateProfileRequest) returns (UpdateProfileReply) {
    option (google.api.http) = {
      put: "/v1/user/profile"
      body: "*"
    };
  }

  rpc CheckLoginState (CheckLoginStateRequest) returns (CheckLoginStateReply) {
    option (google.api.http) = {
      get: "/v1/user/session"
    };
  }
}

message RegisterRequest {
  string mobile = 1;
  string password = 2;
  string nickname = 3;
  string avatar = 4;
}

message LoginRequest {
  string mobile = 1;
  string password = 2;
}

message MockLoginRequest {
  string uid = 1;
}

message AuthReply {
  string token_type = 1;
  string access_token = 2;
  int64 expires_in = 3;
  int64 expire_at = 4;
  string uid = 5;
}

message UserProfile {
  uint64 id = 1;
  string uid = 2;
  string mobile = 3;
  string nickname = 4;
  string avatar = 5;
  int32 status = 6;
}

message GetProfileRequest {}

message GetProfileReply {
  UserProfile profile = 1;
}

message UpdateProfileRequest {
  string nickname = 1;
  string avatar = 2;
}

message UpdateProfileReply {
  UserProfile profile = 1;
}

message CheckLoginStateRequest {}

message CheckLoginStateReply {
  bool logged_in = 1;
  int64 expire_at = 2;
  string uid = 3;
}
