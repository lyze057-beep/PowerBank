upstream emqx_ws_backend {
    server 127.0.0.1:8083;
}

upstream emqx_dashboard_backend {
    server 127.0.0.1:18083;
}

server {
    listen 80;
    server_name emqx.local;

    # MQTT over WebSocket reverse proxy
    location /mqtt {
        proxy_pass http://emqx_ws_backend/mqtt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # EMQX dashboard reverse proxy
    location /dashboard/ {
        proxy_pass http://emqx_dashboard_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
